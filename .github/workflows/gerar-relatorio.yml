name: Gerar relatório PDF
on:
  workflow_dispatch:
  push:
    branches: [entrega-squad6-2026]
    paths:
      - .github/workflows/gerar-relatorio.yml
permissions:
  contents: write
jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y graphviz fonts-dejavu-core
      - run: pip install reportlab pillow
      - run: python gerar_pdf.py
      - name: Publicar PDF atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Relatorio-Squad-6.pdf
          git commit -m 'Atualizar relatório com evidências de staging'
          git push origin HEAD:entrega-squad6-2026
